services:
  # ... (tus servicios existentes: db, redis, php, nginx) ...

  # Servidor de Base de Datos MariaDB
  db:
    image: mariadb:11.2
    container_name: mariadb_app
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: fabrica
      MYSQL_USER: rc
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

  # 5. Contenedor de Respaldo Automatizado
  db_backup:
    image: databack/mysql-backup:latest
    container_name: mariadb_backup
    restart: always
    environment:
      DB_SERVER: db
      DB_PORT: '3306'
      DB_USER: root
      DB_PASS: '1234'
      DB_NAMES: fabrica
      DB_DUMP_FREQ: '1440' # Respaldo cada 1440 minutos (24 horas)
      DB_DUMP_BEGIN: '0000' # Hora de inicio (00:00)
      DB_CLEANUP_TIME: '10080' # Borra respaldos de más de 7 días
    volumes:
      - db_backups:/db
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db_data:
  db_backups: # Volumen persistente para los archivos .sql.gz